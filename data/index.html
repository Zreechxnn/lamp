<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Lampu</title>
    <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
    <div class="scenery">
        <div class="stars">
            <div class="star" style="top: 10%; left: 15%; animation-delay: 0.1s;"></div>
            <div class="star" style="top: 20%; left: 35%; animation-delay: 0.5s;"></div>
            <div class="star" style="top: 15%; left: 60%; animation-delay: 0.2s;"></div>
            <div class="star" style="top: 25%; left: 80%; animation-delay: 0.8s;"></div>
            <div class="star" style="top: 40%; left: 10%; animation-delay: 0.3s;"></div>
            <div class="star" style="top: 50%; left: 25%; animation-delay: 0.6s;"></div>
            <div class="star" style="top: 45%; left: 70%; animation-delay: 0.4s;"></div>
            <div class="star" style="top: 60%; left: 85%; animation-delay: 0.7s;"></div>
            <div class="star" style="top: 70%; left: 20%; animation-delay: 0.2s;"></div>
            <div class="star" style="top: 80%; left: 40%; animation-delay: 0.5s;"></div>
            <div class="star" style="top: 75%; left: 65%; animation-delay: 0.1s;"></div>
            <div class="star" style="top: 85%; left: 90%; animation-delay: 0.3s;"></div>
        </div>
        
        <div class="moon"></div>
        <div class="sun"></div>
        
        <div class="clouds">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
            <div class="cloud cloud-4"></div>
            <div class="cloud cloud-5"></div>
            <div class="cloud cloud-1" style="top: 30%; left: 10%;"></div>
        </div>

        <div class="shooting-stars">
            <div class="shooting-star" style="top: 10%; right: 20%; animation-delay: 0s;"></div>
            <div class="shooting-star" style="top: 25%; right: 50%; animation-delay: 3s;"></div>
            <div class="shooting-star" style="top: 40%; right: 10%; animation-delay: 5.5s;"></div>
            <div class="shooting-star" style="top: 55%; right: 60%; animation-delay: 8s;"></div>
            <div class="shooting-star" style="top: 70%; right: 30%; animation-delay: 11s;"></div>
            <div class="shooting-star" style="top: 85%; right: 70%; animation-delay: 14s;"></div>
            <div class="shooting-star" style="top: 20%; right: 80%; animation-delay: 17s;"></div>
        </div>
    </div>

    <div class="card">
        <div class="header">
            <h2>Kontrol Lampu</h2>
            <div class="connection-status">
                <span id="connectionDot" class="dot offline"></span>
            </div>
        </div>

        <div class="icon-container">
            <svg id="bulbIcon" viewBox="0 0 24 24" onclick="toggleLamp()">
                <path class="bulb-glass" d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z"/>
                <path class="bulb-base" d="M10 20h4c0 1.1-.9 2-2 2s-2-.9-2-2z"/>
            </svg>
        </div>

        <p class="status-text">Status: <strong id="status">Menghubungkan...</strong></p>
    </div>
    
    <script src="script.js?v=5"></script>
</body>
</html>
